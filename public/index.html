<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLASH MUSIC ▸ Cyberpunk Player</title>
  <link rel="stylesheet" href="/css/style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scanlines"></div>
  <div class="grid-bg"></div>

  <div class="app">

    <!-- Left Panel: Player -->
    <div class="panel-left">
      <div class="player">

        <!-- Large Song Title -->
        <div class="song-display">
          <div class="song-title-big" id="songTitleBig">S L A S H</div>
          <div class="song-artist-big" id="songArtistBig">Select a song to start</div>
          <div class="equalizer" id="equalizer">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap">
          <span class="time" id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-glitch"></div>
          </div>
          <span class="time" id="durationTime">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button class="ctrl-btn" id="prevBtn" title="Previous">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn play-btn" id="playBtn">
            <svg id="playIcon" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" width="36" height="36" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="ctrl-btn" id="nextBtn" title="Next">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <!-- Volume -->
        <div class="volume-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
        </div>

        <!-- Playlist -->
        <div class="playlist-section">
          <div class="playlist-header">
            <span>◈ PLAYLIST</span>
            <span class="playlist-count" id="playlistCount"></span>
          </div>
          <div class="playlist-list" id="playlistList">
            <div class="playlist-empty">[ Search songs to add ]</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Right Panel: Lyrics + AI Dialog -->
    <div class="panel-right">
      <!-- Lyrics -->
      <div class="lyrics-section">
        <div class="lyrics-header">
          <span class="lyrics-song-name" id="lyricsSongName"></span>
        </div>
        <div class="lyrics-body">
          <div class="lyrics-content" id="lyricsContent">
            <div class="lyrics-placeholder">[ Lyrics will appear here ]</div>
          </div>
          <div class="pet-container" id="petContainer">
            <canvas id="petCanvas" width="240" height="320"></canvas>
            <div class="pet-label">SLASH-BOT v1.0</div>
          </div>
        </div>
      </div>

      <!-- AI Chat Dialog -->
      <div class="chat-section">
        <div class="chat-header">
          <span>◈ Slash Music</span>
          <span class="chat-status" id="chatStatus"></span>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="chat-msg assistant">
            <div class="msg-avatar">AI</div>
            <div class="msg-bubble">
              <div class="msg-greeting">
                <span class="glitch-text" data-text="SLASH_MUSIC_INTERFACE v3.0">SLASH_MUSIC_INTERFACE v3.0</span>
              </div>
              Describe your mood, scene or genre. Slash Music will find the perfect tracks.
            </div>
          </div>
        </div>
        <div class="chat-input-wrap">
          <input type="text" id="chatInput" class="chat-input" placeholder="> Describe your vibe..." autocomplete="off">
          <button id="chatSendBtn" class="chat-send-btn" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <audio id="audio" preload="auto"></audio>
  <script src="/js/app.js"></script>
</body>
</html>
